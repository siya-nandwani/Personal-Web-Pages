<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="container">
        <div class="mainContent">
            <div class="answer">
                
            </div>
            <div class="grid">
                <button id="d7" class="gridButton">7</button>
                <button id="d8" class="gridButton">8</button>
                <button id="d9" class="gridButton">9</button>
                <button id="equals" class="equalButton" >=</button>
                <button id="d4" class="gridButton">4</button>
                <button id="d5" class="gridButton">5</button>
                <button id="d6" class="gridButton">6</button>
                <button id="mul" class="gridButton">*</button>
                <button id="d1" class="gridButton">1</button>
                <button id="d2" class="gridButton">2</button>
                <button id="d3" class="gridButton">3</button>
                <button id="sub" class="gridButton">-</button>
                <button id="decimal" class="gridButton">.</button>
                <button id="0" class="gridButton">0</button>
                <button id="div" class="gridButton">/</button>
                <button id="plus" class="gridButton">+</button>
            </div>
            <div >
                <button class="clearButton">CLEAR</button>
            </div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
