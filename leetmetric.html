<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetmetrics</title>
    <link rel="stylesheet" href="leetmetric.css">
</head>
<body>
    <div class="container">
        <h1>LeetMetric</h1>
        <div class="userContainer">
            <p>Enter your username below:</p>
            <div class="userInputContainer">
                <input type="text" placeholder="Enter username here" id="userInput">
                <button id="searchButton">Search</button>
            </div>
        </div>
        <div class="statsContainer">
            <div class="progress">
                <div class="progressItem">
                    <div class="easyProgress circle">
                        <span id="easyLabel"></span>
                       <p>Easy</p> 
                    </div>
                </div>
                <div class="progressItem">
                    <div class="mediumProgress circle">
                        <span id="mediumLabel"></span>
                        <p>Medium</p>
                    </div>
                </div>
                <div class="progressItem">
                    <div class="hardProgress circle">
                        <span id="hardLabel"></span>
                        <p>Hard</p>
                    </div>
                </div>
            </div>
            
        </div>
        <div class="statsCards"></div>
    </div>
    <script src="leetmetric.js"></script>
</body>
</html>
